<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#F2F4F8">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="DentalFlow: registro trattamenti e incassi per igienista dentale">
  <title>DentalFlow</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DentalFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="./js/theme-boot.js"></script>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <h1 class="visually-hidden">DentalFlow</h1>

  <!-- barra superiore compatta: compare quando il titolo grande esce dallo schermo -->
  <div id="topbar" class="topbar" aria-hidden="true">
    <span id="topbar-title" class="topbar-title"></span>
  </div>

  <span id="offline-badge" class="visually-hidden" role="status" hidden>
    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" focusable="false"><path d="M8.5 6.6a6 6 0 0 1 9.1 3.95A4 4 0 0 1 19.4 18M15.5 18.5H7a4.5 4.5 0 0 1-.9-8.9M3.5 3.5l17 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Offline
  </span>

  <div id="load-warning" class="float-card float-warning" role="alert" hidden></div>

  <main id="view" class="view" tabindex="-1">
    <noscript><p class="card">DentalFlow richiede JavaScript attivo nel browser.</p></noscript>
  </main>

  <div id="update-banner" class="float-card update-card" role="status" hidden>
    <span class="update-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="icon" focusable="false"><path d="M12 2.5c.5 4.6 2.9 7 7.5 7.5-4.6.5-7 2.9-7.5 7.5-.5-4.6-2.9-7-7.5-7.5 4.6-.5 7-2.9 7.5-7.5zM19 15.5c.2 1.8 1.1 2.7 2.9 2.9-1.8.2-2.7 1.1-2.9 2.9-.2-1.8-1.1-2.7-2.9-2.9 1.8-.2 2.7-1.1 2.9-2.9z" fill="currentColor"/></svg>
    </span>
    <span class="update-text">
      <strong>Nuova versione</strong>
      <span>Tocca Aggiorna</span>
    </span>
    <button type="button" id="update-btn" class="update-btn">Aggiorna</button>
  </div>

  <nav class="tabbar" aria-label="Sezioni">
    <a href="#oggi" data-route="oggi">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="tab-fill" d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Oggi</span>
    </a>
    <a href="#inserisci" data-route="inserisci">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="tab-fill" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path class="tab-glyph" d="M12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Inserisci</span>
    </a>
    <a href="#registro" data-route="registro">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="tab-fill" x="4" y="3.5" width="16" height="17" rx="3" stroke="currentColor" stroke-width="2"/><path class="tab-glyph" d="M8 8.5h8M8 12h8M8 15.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Registro</span>
    </a>
    <a href="#recap" data-route="recap">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect class="tab-fill" x="5.5" y="11" width="3" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect class="tab-fill" x="10.5" y="6" width="3" height="11" rx="1" stroke="currentColor" stroke-width="2"/><rect class="tab-fill" x="15.5" y="9" width="3" height="8" rx="1" stroke="currentColor" stroke-width="2"/></svg>
      <span>Recap</span>
    </a>
    <a href="#altro" data-route="altro">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="tab-fill" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><circle class="tab-dot" cx="8" cy="12" r="1.3"/><circle class="tab-dot" cx="12" cy="12" r="1.3"/><circle class="tab-dot" cx="16" cy="12" r="1.3"/></svg>
      <span>Altro</span>
    </a>
  </nav>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="dialog-host"></div>
</body>
</html>
